[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brainforgemd"
version = "0.1.0"
description = "Convert heterogeneous files into provenance-preserving Markdown corpora for RAG, GraphRAG, and context systems."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Vat-faire"}]
keywords = ["markdown", "rag", "graphrag", "ingestion", "documents", "ocr", "transcription", "knowledge-base"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
]
dependencies = []
[project.optional-dependencies]
docling = ["docling>=2.60,<3"]
markitdown = ["markitdown[all]>=0.1.3,<1"]
msg = ["extract-msg>=0.54,<1"]
parquet = ["pyarrow>=18,<24"]
# Docling declares OpenDocument support but does not install its reader, so .odt/.ods/.odp
# failed with "the 'odfdo' package is required" on an otherwise complete installation.
odf = ["odfdo>=3.22,<4"]
# Audio and video transcription needs a speech model. Without it every .wav/.mp3/.mp4
# fails with "whisper is not installed". Kept out of `all` because it pulls a multi-
# gigabyte model stack; ask for it explicitly with brainforgemd[asr].
asr = ["docling[asr]>=2.60,<3"]
all = [
  "docling>=2.60,<3",
  "markitdown[all]>=0.1.3,<1",
  "extract-msg>=0.54,<1",
  "pyarrow>=18,<24",
  "odfdo>=3.22,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "build>=1.2,<2",
]

[project.scripts]
brainforgemd = "brainforgemd.cli:main"
bfmd = "brainforgemd.cli:main"

[project.urls]
Homepage = "https://github.com/Vat-faire/BrainForgeMD"
Repository = "https://github.com/Vat-faire/BrainForgeMD"
Issues = "https://github.com/Vat-faire/BrainForgeMD/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
