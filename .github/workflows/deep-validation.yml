name: Deep Validation

on:
  push:
    branches: [validation/deep-format-tests]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -vv tests/integration/test_core_deep.py
      - run: ruff check tests/integration src

  clean-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python tests/integration/smoke_wheel.py

  rich-formats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native media and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng tesseract-ocr
      - run: python -m pip install --upgrade pip
      - name: Install full BrainForgeMD stack and fixture generators
        run: |
          pip install -e ".[all,dev]"
          pip install reportlab python-docx python-pptx openpyxl pillow
      - run: brainforgemd doctor
      - run: brainforgemd formats
      - name: Convert synthetic PDF, Office, image, EPUB, Parquet, audio and video corpus
        env:
          BFMD_RICH_VALIDATION: "1"
        run: pytest -vv -s tests/integration/test_rich_formats.py
